# Real on-device backends (Phase 2). Fully offline once models are fetched (§9.1).
# Used for the live gate: ladpipe run --video <lecture> --config config/real.yaml

pipeline_version: "0.1.3"   # 0.1.3: AD timing + multimodal VL fixes invalidate older caches

backends:
  preprocess: local
  vl: mlxvlm
  tts: kokoro

rules_file: ../rules_for_slides.yaml   # relative to this file, so a fresh clone works unedited

prefilter:
  redundancy_threshold: 0.8

rungs:
  max_compress_factor: 1.3
  time_shift_cap_s: 5.0
  placeholder_marker_s: 0.4
  merge_gap_s: 3.0   # fuse AD lines whose moments sit <= this apart (0 = never)
  # let the slide be seen and the lecturer's pointing phrase be heard before the freeze
  extended_settle_s: 1.2

tts:
  voice: af_heart   # Kokoro 'heart' voice (American English)
  sample_rate: 24000
  kokoro:
    model_path: ../models/kokoro

vl:
  # 4-bit MLX weights; vision stays GPU-resident (fixes the llama.cpp CPU-fallback:
  # ~4s/call here vs ~40s). Qwen3-VL-2B: same family as the fine-tune target (§6.1),
  # fits 8 GB (1.7 GB), good quality. On THIS 8 GB machine the Gemma options don't
  # fit (gemma-4-e2b won't load on current mlx-vlm; gemma-3n-E2B OOMs; gemma-3-4b
  # times out). Swap is config-only: repoint at the converted fine-tuned MLX weights.
  # ad4edu-qwen3vl-2b-mm-8bit = Qwen3-VL-2B-Instruct + the AD4Edu LoRA, MULTIMODAL arm
  # (Psychias/ad4edu-qwen3vl-2b-sft, seed0: trained on keyframe images + OCR + speech,
  # learns the emit/suppress gate) merged and quantised by scripts/merge_adapter.py.
  # 8-bit, not 4-bit: at 4 bits the merged model loses the JSON output contract and
  # rambles (verified on real keyframes); 8-bit is 2.5 GB, ~4 s/moment, peak ~3.8 GB.
  # Base weights fall back to models/qwen3vl-2b-4bit.
  model: ../models/ad4edu-qwen3vl-2b-mm-8bit
  image_max_side: 640   # 384 hallucinated graph details (colours, peaks); 640 is faithful at ~4.5 s/call
  max_ad_words: 30   # safety bound only: the fine-tune fits its text to the pause itself
  verbosity: standard  # AD detail level: brief | standard | detailed

preprocess:
  whisper_backend: mlx   # GPU on Apple Silicon — the big first-open speed-up
  # Local MLX weights fetched by scripts/fetch_models.sh, so no run ever touches the network.
  # A Hugging Face repo id (mlx-community/whisper-large-v3-turbo) also works but downloads on
  # first use.
  whisper_model: ../models/whisper
  scene_threshold: 0.15  # 0.3 missed 15 of 41 real slide changes on a Pearson deck (two of them
                         # figures); at 0.15 every extra change was a real slide, none cursor noise.
                         # phash dedup still drops near-duplicates.
  keyframe_dedup_max_distance: 5
  transcript_pad_s: 2.0
  ocr: auto   # auto -> on: the fine-tune was trained with the OCR line alongside the keyframe
  # Cursor dwells: a deliberate mouse move that comes to rest becomes a "pointing" moment
  # (preprocess/pointing.py). Scene detection cannot see the cursor at all, yet pointing
  # is the largest class in the corpus the AD model was trained on.
  pointing: true
  pointing_min_dwell_s: 0.8   # the cursor must hold still this long
  pointing_min_gap_s: 10.0    # at most one pointing moment per 10 s on a slide

extended_ad:
  enabled: true
  always_pause: true   # every AD pauses the video and plays the full description (no gap-squeezing)

cache:
  dir: ~/Library/Application Support/LectureAD/cache

player:
  captions_default_on: true
